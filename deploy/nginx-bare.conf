# ============================================================================
# 地球OL · 站点配置（裸机版 · 不用 Docker）
#
# 用法（完整步骤见 docs/DEPLOY.md「路径 A」）：
#   sudo cp deploy/nginx-bare.conf /etc/nginx/sites-available/earthonline
#   sudo ln -sf /etc/nginx/sites-available/earthonline /etc/nginx/sites-enabled/earthonline
#   sudo nano /etc/nginx/sites-available/earthonline   # 只改 server_name 一行
#   sudo nginx -t && sudo systemctl reload nginx
#
# 与仓库根目录 nginx.conf（Docker 版）是同一套策略的两个落点：SPA 回退 /
# 压缩 / 安全头 / 三档缓存。**改这里的规则时两份一起改** —— verify-ops 会
# 逐条比对两处的策略关键词，漂了闸门会响。两处差异只有两行：root 与 server_name。
# ============================================================================

server {
    listen 80;
    server_name earth.example.com;      # ← 改成你的域名

    root /var/www/earthonline/dist;     # ← 克隆位置见文档；改了克隆目录就同步改这里
    index index.html;
    charset utf-8;

    # ---- 压缩 -----------------------------------------------------------------
    # 只管文本类。PNG 本来就是压缩格式，再 gzip 一遍是白烧 CPU。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---- 安全响应头 -----------------------------------------------------------
    # 禁外部 iframe 嵌入：这个应用是一本私人日记，不该出现在别人的框里。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #
    # 注意：这里**故意没有** Permissions-Policy。
    # 应用要用定位（世界页的 GPS 锚点）与相机（里程碑记录里拍照）——
    # 一条图省事的 `Permissions-Policy: geolocation=(), camera=()` 会把这两个
    # 功能直接掐死，而且症状是"按钮点了没反应"，很难往配置上想。

    # ---- 路由 -----------------------------------------------------------------
    location / {
        # SPA 回退：深链在服务器上并不存在，交还 index.html 由前端接手
        try_files $uri $uri/ /index.html;
    }

    # ---- 缓存策略（三档） -----------------------------------------------------
    # ① 带内容指纹的构建产物：文件名一变即失效，可以放心一年
    location /assets/ {
        expires 1y;
    }

    # ② 应用外壳与 PWA 三件套：不缓存，发版即生效
    #    （sw.js 尤其不能被长缓存 —— 浏览器要能随时拿到最新那一行）
    location = /index.html            { expires -1; }
    location = /sw.js                 { expires -1; }
    location = /manifest.webmanifest  { expires -1; }

    # ③ 图标：极少变，但发新版时希望跟得上，给一天
    location ~* /(icon|apple-touch-icon).*\.(png|svg)$ {
        expires 1d;
    }
}
