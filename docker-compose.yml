# 地球OL · 生产编排（三个服务：应用 + Caddy + 云同步 —— 一条命令起整个栈）
#
#   docker compose up -d --build     启动 / 升级（首次构建几分钟）
#   docker compose logs -f           看日志
#   docker compose down              停机（sync_data 卷不动，密文与认领都还在）
#
# 对外只有 Caddy 一个面：80 / 443。应用与同步容器都不对宿主机开端口，
# 只有 Caddy 能到它们（compose 内网 earthonline:80 与 sync:3000）。
#
# HTTPS 的开关是 .env 里的一行：
#   SITE_ADDRESS=earth.example.com   → Caddy 自动申请并续期证书
#   不填 → 默认 ":80"，纯 HTTP，先用 IP 验证
# 见 docs/DEPLOY.md。
services:
  earthonline:
    build: .
    image: earthonline:latest
    container_name: earthonline
    # 服务器重启、崩溃、Docker 升级之后自己回来；只有手动 down 才真的停
    restart: unless-stopped

  # 云同步：口令加密的存档在这里有一份。它只搬密文（读不懂内容），
  # 认领信息与密文都在 sync_data 卷里 —— 重建容器不碰它。
  sync:
    build:
      context: .
      dockerfile: server.Dockerfile
    image: earthonline-sync:latest
    container_name: earthonline-sync
    restart: unless-stopped
    volumes:
      # 这块卷是"存档在服务器上"的全部物质形态；删它 = 云端那份消失
      # （本地导出与另一台设备上的副本不受影响）
      - sync_data:/data

  caddy:
    image: caddy:2
    container_name: earthonline-caddy
    restart: unless-stopped
    # 对外就这两个端口：80（HTTP 与 ACME 挑战）、443（HTTPS）
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 默认 ":80" = 纯 HTTP 跑在所有主机名上（还没有域名时的形态）
      - "SITE_ADDRESS=${SITE_ADDRESS:-:80}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与 ACME 账户数据：升级 / 重建容器都不丢，不重签
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      earthonline:
        # 等应用体检通过再起 —— 首启不撞空上游，compose ps 里的 healthy 是真话
        condition: service_healthy
      sync:
        # 同步服务同理：/sync/* 的上游也必须是活的
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  sync_data:
